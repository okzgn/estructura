name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # The repository has no lockfile, so `npm install` is used instead of `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Version of the dist headers, ES3 syntax of the UMD build, and UMD/ESM builds in sync.
      - name: Check the builds
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Type tests
        run: npm run test:types
